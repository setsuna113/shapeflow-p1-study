[project]
name = "shapeflow-p1-study"
version = "0.1.0"
description = "Week-1 kill/keep study for ShapeFlow P1 nodes WEBPAGE_P1 and RESEARCHER_CLOSE"
requires-python = "==3.12.*"

# Direct dependencies are declared here; uv.lock holds the exact resolution and
# `uv sync --frozen` is what the launch gate enforces. Do not relax --frozen.
#
# Note which pins are absent. Anything the pinned vendor also depends on is left unpinned here
# and constrained under [tool.uv] to the vendor's own lock instead -- see the note there.
dependencies = [
  # CLI / config / serialization
  "typer~=0.15.1",
  "pydantic",
  "PyYAML~=6.0.2",
  "orjson",
  "jsonschema~=4.23.0",
  # HTTP / providers
  "httpx",
  "tenacity~=9.0.0",
  "tavily-python",
  "openai",
  # analysis (not part of the graph; pinned normally)
  "numpy~=2.2.1",
  "scipy~=1.15.0",
  "pandas>=2.3.1",
  "pyarrow>=19.0.1",
  "statsmodels~=0.14.4",
  "scikit-learn~=1.6.0",
  "matplotlib~=3.10.0",
  "seaborn~=0.13.2",
  # storage / telemetry
  "zstandard~=0.23.0",
  "psutil~=6.1.1",
  "nvidia-ml-py~=12.560.30",
  # evidence parsing
  "beautifulsoup4",
  "markdown-it-py~=3.0.0",
  # exact Qwen token budgets and offset-preserving evidence chunking
  "tokenizers~=0.22.0",
  # the pinned+patched vendor agent (resolved from .build/, see [tool.uv.sources])
  "open_deep_research",
]

[project.optional-dependencies]
dev = [
  "pytest~=8.3.4",
  "pytest-asyncio~=0.25.1",
  "hypothesis~=6.123.2",
  "ruff~=0.8.6",
]

[project.scripts]
shapeflow-p1 = "shapeflow_p1.cli:app"

[tool.uv]
# The pinned vendor commit ships its OWN uv.lock, and that resolution is the stack the graph
# was actually tested against -- so it is part of what "pinned at 408da44" means. Letting our
# pins re-resolve the agent framework would change the system under measurement, not just the
# libraries around it. It had already done real damage: our first resolution produced
# mcp 1.12.4 with langchain-mcp-adapters 0.3.0, a pair that cannot import each other, so
# `import open_deep_research.deep_researcher` failed outright.
#
# Constrained: the agent framework, model/tool clients and their protocol libraries.
# Not constrained: analysis libraries, which never touch the graph.
constraint-dependencies = [
  "aiohttp==3.14.1",
  "anthropic==0.111.0",
  "beautifulsoup4==4.14.3",
  "httpcore==1.0.9",
  "httpx-sse==0.4.0",
  "httpx==0.28.1",
  "jsonpatch==1.33",
  "langchain-anthropic==1.4.6",
  "langchain-aws==1.2.4",
  "langchain-classic==1.0.7",
  "langchain-community==0.4.1",
  "langchain-core==1.4.8",
  "langchain-deepseek==1.0.1",
  "langchain-google-genai==4.2.0",
  "langchain-google-vertexai==3.2.3",
  "langchain-groq==1.1.2",
  "langchain-mcp-adapters==0.2.1",
  "langchain-openai==1.1.14",
  "langchain-protocol==0.0.18",
  "langchain-tavily==0.2.17",
  "langchain-tests==1.1.6",
  "langchain-text-splitters==1.1.2",
  "langchain==1.2.10",
  "langgraph-api==0.10.0",
  "langgraph-checkpoint==4.0.0",
  "langgraph-cli==0.3.1",
  "langgraph-prebuilt==1.0.8",
  "langgraph-runtime-inmem==0.30.0",
  "langgraph-sdk==0.3.5",
  "langgraph==1.0.10rc1",
  "langsmith==0.8.18",
  "mcp==1.23.0",
  "openai==2.32.0",
  "orjson==3.11.6",
  "pydantic-core==2.33.2",
  "pydantic-settings==2.14.2",
  "pydantic==2.11.5",
  "requests-oauthlib==2.0.0",
  "requests-toolbelt==1.0.0",
  "requests==2.33.0",
  "sse-starlette==2.1.3",
  "starlette==1.3.1",
  "tavily-python==0.7.5",
  "tiktoken==0.9.0",
  "uvicorn==0.34.3",
]

# The patched materialization is created by scripts/bootstrap_and_run.sh BEFORE
# `uv sync --frozen` runs. Resolving ODR from here (never from PyPI or a global
# site-packages) is what makes the P1 hooks the only ODR on the import path.
#
# The install is a COPY, not editable, so `open_deep_research.__file__` does not live under
# .build/ -- and it is a namespace package, so __file__ is None anyway. The launch gate
# therefore compares the INSTALLED package tree's hash to the patched tree's hash, which is
# the stronger check: it proves the bytes are the patched bytes, not merely that a path
# resolves somewhere.
[tool.uv.sources]
open_deep_research = { path = ".build/open_deep_research-patched", editable = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shapeflow_p1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:shapeflow_p1.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) is fine in tests; invariant asserts in src are deliberate and reviewed.
ignore = ["S101"]
