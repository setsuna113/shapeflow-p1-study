# Decision thresholds — protocol v0.1 (plan §15.2).
#
# These are NOT tunable defaults. They are hash-locked by protocol/launch_approval.json
# (decision_thresholds_sha) and adopted as-is from the plan. The automatic policy freeze may
# only COPY these margins; it may never select or modify them after seeing mini results.
# Changing any value mints a new protocol SHA and invalidates the existing approval.
version: v0.1

structural:
  invalid_id_max: 0
  lineage_error_max: 0
  critical_item_miss_max: 0

selector:
  weighted_recall_min: 0.90
  contradiction_pair_recall_min: 0.85
  negative_gap_recall_min: 0.85

# One-sided NI margins (percentage points) for the co-primary quality guards, combined by
# intersection-union (all must pass).
quality_ni_margin:
  weighted_required_atom_recall_pp: -5
  grounded_claim_precision_pp: -3
  citation_correctness_pp: -3
  citation_association_pp: -3
  required_facet_coverage_pp: -5
  qualified_report_rate_pp: -5
  critical_harm_risk_pp_max: 3
  terminal_failure_risk_pp_max: 2

utility:
  minimum_meaningful_work_reduction: 0.10
  preferred_strong_reduction: 0.20

coverage:
  conditional_task_exposure_coverage_lcb_min: 0.30

operational_guards:
  block_makespan_saving_lcb_min: 0.10
  throughput_improvement_lcb_min: 0.10
  p95_latency_ratio_ucb_max: 1.10
  gpu_joule_ratio_ucb_max: 1.00
  terminal_failure_increase_ucb_max_pp: 2
  critical_harm_increase_ucb_max_pp: 3

thesis:
  e2e_speedup_lcb_min: 1.5

eligibility_learner:
  max_depth: 2
  min_independent_tasks_per_leaf: 8
  bootstrap_rule_stability_min: 0.70
