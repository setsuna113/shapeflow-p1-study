# Where the tasks come from, and what that permits (plan §7).
#
# Plan §7.1 gives three sources in order of preference. There is no user-supplied sealed registry
# and no pre-existing Tavily-compatible pool, so this round builds the third and says so in every
# artifact it produces: FORMATIVE_MACHINE_AUTHORED, claim scope FORMATIVE_ONLY. That label is
# load-bearing, not a disclaimer -- a machine-authored corpus cannot support a confirmatory
# claim, and presenting one as if it could would be the same category of error as any of the
# fabrications this study guards against.
version: v0.1

source:
  precedence_used: 3            # 1 = user-sealed registry, 2 = existing pool, 3 = machine-authored
  corpus_tier: FORMATIVE_MACHINE_AUTHORED
  claim_scope: FORMATIVE_ONLY
  registry_path: registry_v1.json          # relative to paths.tasks; write-once

# The author is never the subject. Tasks are written by DeepSeek; a corpus written by the model
# under test would be selected for what that model finds easy, and every arm would inherit the
# bias while the comparison silently absorbed it. The seal refuses if the authoring model matches
# the target.
authoring:
  provider: deepseek
  model_env: DEEPSEEK_JUDGE_MODEL           # resolved once at launch, then frozen
  forbidden_author_model_substring: Qwen
  temperature: 0.4
  top_p: 1.0
  seed: 20260724
  max_tokens: 4096
  tasks_per_request: 4
  prompt_version: task_author_v1

# 64 sealed specs. The 48-task confirmatory holdout of plan §7.4's capacity target is NOT
# authored here: it may not be opened this round, and a future confirmatory study requires a new
# sealed registry with its own protocol SHA and approval anyway -- so authoring it now would
# spend the Tavily cap on a corpus that could never be used for the claim it was meant for.
splits:
  FORMATIVE_SCREEN: 32
  FORMATIVE_POWER_PILOT: 16
  RESERVE: 16

# Plan §7.2. Every stratum must be represented: "P1 helps" without knowing where it helps is not
# an answer, and the eligibility envelope is one of the five questions the study must settle.
strata_min_counts:
  evidence_volume_low: 3
  evidence_volume_medium: 3
  evidence_volume_high: 3
  facets_1_2: 3
  facets_3_4: 3
  facets_5_plus: 3
  single_source_fact: 3
  multi_source_synthesis: 3
  source_conflict: 4
  negative_evidence: 4
  citation_dense: 3
  table_list_heavy: 3
  high_redundancy: 3
  raw_content_missing: 2
  close_research_complete: 3
  close_max_calls: 3
  close_no_tool: 2

# Mechanical, pre-seal, and fatal. Each of these has a way of being wrong that looks fine: a
# question no query can answer produces an empty world that reads as a P1 failure; two
# paraphrases counted separately overstate n; a cluster split across SCREEN and POWER_PILOT
# leaks. None of them are visible once results exist.
audit:
  min_question_chars: 60
  max_question_chars: 600
  min_required_facets: 1
  max_required_facets: 8
  min_fixed_queries: 3
  max_duplicate_jaccard: 0.6
  require_distinct_topic_clusters: 12
  forbid_cluster_split_across_splits: true
  require_all_strata: true

split_rule:
  # Whole clusters move together. Two paraphrases of one question, or two tasks sharing most of
  # their sources, are one observation.
  unit: topic_cluster
  reserve_order: frozen_at_seal
