# Budget caps — protocol v0.1 (plan §3.5). These are the authorized HARD upper bounds, not
# placeholders. The provider reads real balance at launch and may only TIGHTEN the effective
# cap by a deterministic formula (min(cap, available - reserve)); it may never raise a cap or
# raise one after the fact.
version: v0.1

api_budget:
  # Exa replaced Tavily when the Tavily quota ran out. The tavily_* caps stay so the 262
  # rejected requests this round already spent remain on the books under the resource that
  # recorded them; nothing new is charged there.
  exa_max_requests: 500
  exa_max_usd: 5.00
  tavily_max_requests: 500
  tavily_max_credits: 1000
  # Raised on 2026-07-26, on explicit instruction, after the original caps were shown to be
  # unable to build the answer key at all. They were not sized from a measurement: at the
  # observed rate the $10 ceiling covered 2 of 48 TruthPackets.
  #
  # Measured on this corpus, from the first two completed packets:
  #   ~290 JUDGE_TRUTH calls per task   (~4 per candidate atom, most of which are rejected)
  #   $0.01195 per request, 2512 input / 867 output tokens per request
  # So the remaining 46 tasks are ~13,300 calls, ~$160, ~33M input and ~12M output tokens.
  #
  # Each cap below is that projection plus roughly a quarter for variance -- a ceiling, not a
  # spend plan. They stay hard: the provider may still only tighten them, and hitting one stops
  # the campaign rather than quietly buying past it. The request and token caps are raised
  # alongside the dollar cap on purpose; leaving any one of them at the old value would stop
  # the build just as dead, having spent the others.
  deepseek_max_requests: 20000
  deepseek_max_input_tokens: 50000000
  deepseek_max_output_tokens: 18000000
  deepseek_max_usd: 200.00
  max_remote_calls: 22000

campaign_budget:
  max_gpu_hours: 150
  max_wall_hours: 168
  max_disk_bytes: 8589934592        # 8 GiB object-store cap
  min_free_disk_bytes: 12884901888  # 12 GiB floor -> pause admission below this

retry_policy:
  max_retries_per_request: 3
  max_consecutive_failures: 5
