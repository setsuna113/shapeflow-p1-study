# Exa acquisition parameters (plan §6.2). Explicit, never `type: auto`.
#
# The same query must address the same slice of the web on every acquisition, so every retrieval
# parameter is pinned here and hashed into the query's snapshot id. `type: auto` would let the
# provider choose a search strategy per query -- the same defect as Tavily's `auto_parameters`:
# two acquisitions of one query could freeze two different worlds and nothing downstream could
# tell. ExaParams refuses `auto` rather than trusting this file to be right.
#
# The provider changed from Tavily to Exa when the Tavily quota ran out. `text` is the cleaned
# page text and becomes PAGE_RAW_CONTENT (still not browser HTML, so the node keeps its name);
# `highlights` are the query-relevant excerpts and become the short snippet. Exa returns no
# relevance score, so occurrences record none rather than a fabricated one. The provider name
# and the mapping version are inside every snapshot id, so an Exa world can never be confused
# with the Tavily one taken for the same query text.
version: v0.1

exa:
  type: fast
  num_results_per_query: 8
  text_max_characters: 100000
  include_html_tags: false
  highlights: true
  category: null
  timeout_seconds: 60

# The published price list, as data, so admission control and the report cite one source.
# $7/1k requests including 10 results, $1/1k results beyond that.
exa_pricing:
  usd_per_request: 0.007
  usd_per_extra_result: 0.001
  results_included: 10
  source: https://exa.ai/docs/changelog/pricing-update
  retrieved_utc: "2026-07-24"

# Per plan §6.2 every task's queries must cover these roles. The count is what bounds the
# search spend: 48 acquired tasks x at most 8 queries stays inside the request cap with
# headroom for reserve substitutions, so the registry is never trimmed after the fact.
queries_per_task:
  original_question: 1
  per_required_facet: 1
  conflict_probe: 1
  negative_or_gap_probe: 1
  table_list_numeric_probe: 1
  max_total: 8

# Which splits are acquired now. RESERVE specs are sealed with the rest but their world is only
# fetched if a task is actually substituted in -- acquiring 16 worlds that may never be used
# would spend the cap on nothing.
acquire_splits:
  - FORMATIVE_SCREEN
  - FORMATIVE_POWER_PILOT

freeze:
  normalization_version: v1
  # Everything the audit trail needs to reconstruct what was seen. Keeping only `content` would
  # lose the provenance that citation lineage is built from.
  record_fields:
    - request_id
    - query_id
    - query_text
    - request_parameters
    - response_time
    - usage
    - failed_results
    - rank
    - title
    - url
    - content
    - score
    - raw_content
    - published_date
    - fetched_at_utc
    - raw_response_sha256

# Treatment runs never touch the network. A replay miss is fatal by construction: there is no
# code path from the replay backend to a live search, so a checkpoint fork cannot diverge from
# the world it was frozen in.
replay:
  fail_closed_on_miss: true
  allow_live_fallback: false

# Deterministic retrieval over the task-local pool during end-to-end runs. Query text may
# legitimately differ between arms -- that divergence is part of the effect being measured --
# but the corpus and the ranking are fixed, so the same query is always byte-identical.
frozen_corpus:
  ranker: bm25_v1
  k1: 1.5
  b: 0.75
  top_k: 5
  tie_break: occurrence_id
