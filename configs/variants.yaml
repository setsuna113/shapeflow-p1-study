# The first-round variant registry (plan §10). Each entry's canonical form is hashed to a
# variant_sha256 at registry-build time; the design (block_design.py) enumerates legal variants
# from here. Controls (P0, *-CPU, *-PROSE) are is_control:true and never promote.
#
# The controls are not optional: SHORT_PROSE separates the pointer mechanism from simply decoding
# fewer tokens, and CPU_LEXICAL separates LLM selection from deterministic lexical selection.
version: v1

# Sharing one SOURCE header across a contiguous run changes how many tokens P1 materializes
# relative to P0, so it is part of the protocol, not an implementation detail. Visible spans
# may share a header only when their capture-time byte-range source binding is identical; mere
# message adjacency cannot assign Alpha's URL to Beta. This value is config-hashed and asserted
# equal to renderer.RENDERER_GROUPING_VERSION by tests.
renderer:
  grouping_version: renderer_visible_source_binding_and_order_v3

variants:
  - {variant_id: P0,            node: P0,          chunker: vendor,               scope: vendor,        contract: VENDOR_PROSE, aggregation: vendor,           close_mode: vendor,             selector_backend: VENDOR,      publication_path: VENDOR_PROSE,         output_representation: PROSE,             is_control: true}

  # WEBPAGE_P1 family
  - {variant_id: H00-CPU,       node: WEBPAGE_P1,  chunker: markdown_structure_v1, scope: per_page,      contract: P1_ID,        aggregation: stable_union_v1, close_mode: separate,           selector_backend: CPU_LEXICAL, publication_path: STRUCTURED_SELECTION, output_representation: EVIDENCE_IDS,      is_control: true}
  - {variant_id: H00-PROSE,     node: WEBPAGE_P1,  chunker: markdown_structure_v1, scope: per_page,      contract: SHORT_PROSE,  aggregation: stable_union_v1, close_mode: separate,           selector_backend: LLM,         publication_path: DIRECT_PROSE,         output_representation: SHORT_PROSE,      is_control: true}
  - {variant_id: H01,           node: WEBPAGE_P1,  chunker: fixed_token_v1,        scope: per_page,      contract: P1_ID,        aggregation: stable_union_v1, close_mode: separate,           selector_backend: LLM,         publication_path: STRUCTURED_SELECTION, output_representation: EVIDENCE_IDS}
  - {variant_id: H02,           node: WEBPAGE_P1,  chunker: markdown_structure_v1, scope: per_page,      contract: P1_ID,        aggregation: stable_union_v1, close_mode: separate,           selector_backend: LLM,         publication_path: STRUCTURED_SELECTION, output_representation: EVIDENCE_IDS}
  # Freeze-2 whole-batch H family. `scope: whole_batch` is the unit HC_MECHANISM_v1 always
  # specified -- one selector request per gather batch, under one rendered-token budget. The two
  # rows below are the exact whole-batch analogues of H00-CPU and H02 above, so `H02 -> HW02`
  # and `H00-CPU -> HW00-CPU` each change only the scope. That is what makes the unit itself
  # measurable rather than merely corrected: at a mean 9.07 pages per batch the per-page arms
  # ran under an effective 9x512 budget, and these run under 512.
  - {variant_id: HW00-CPU,      node: WEBPAGE_P1,  chunker: markdown_structure_v1, scope: whole_batch,  contract: P1_ID,        aggregation: stable_union_v1, close_mode: separate,           selector_backend: CPU_LEXICAL, publication_path: STRUCTURED_SELECTION, output_representation: EVIDENCE_IDS,      is_control: true}
  - {variant_id: HW02,          node: WEBPAGE_P1,  chunker: markdown_structure_v1, scope: whole_batch,  contract: P1_ID,        aggregation: stable_union_v1, close_mode: separate,           selector_backend: LLM,         publication_path: STRUCTURED_SELECTION, output_representation: EVIDENCE_IDS}

  # Amendment 1: the four matched shootout arms. Two budgets bind at opposite ends of one
  # request -- the engine's context window before the selector is called, the 512 rendered
  # tokens after it has chosen -- and each is enforced by its own deterministic CPU packer, so
  # the model guesses neither. All four share `budget_pack_v1` as the output packer, so an arm
  # differs from its neighbour in exactly one thing.
  #
  # The two contrasts these exist to produce:
  #   CPU-FULL      - CPU-PROMPTVIEW = the price of deleting evidence to fit the LLM
  #   LLM-PROMPTVIEW - CPU-PROMPTVIEW = whether the LLM is smarter on the same visible evidence
  # Without the first, an LLM that loses cannot be told apart from one that only saw a
  # truncated candidate set.
  - {variant_id: CPU-FULL,              node: WEBPAGE_P1, chunker: markdown_structure_v1, scope: whole_batch, contract: P1_ID,       aggregation: budget_pack_v1, close_mode: separate, selector_backend: CPU_LEXICAL, publication_path: STRUCTURED_SELECTION, output_representation: EVIDENCE_IDS, is_control: true, prompt_admission: none}
  - {variant_id: CPU-PROMPTVIEW,        node: WEBPAGE_P1, chunker: markdown_structure_v1, scope: whole_batch, contract: P1_ID,       aggregation: budget_pack_v1, close_mode: separate, selector_backend: CPU_LEXICAL, publication_path: STRUCTURED_SELECTION, output_representation: EVIDENCE_IDS, is_control: true, prompt_admission: prompt_pack_v1}
  - {variant_id: LLM-PROMPTVIEW,        node: WEBPAGE_P1, chunker: markdown_structure_v1, scope: whole_batch, contract: P1_ID,       aggregation: budget_pack_v1, close_mode: separate, selector_backend: LLM,         publication_path: STRUCTURED_SELECTION, output_representation: EVIDENCE_IDS, prompt_admission: prompt_pack_v1}
  - {variant_id: SHORTPROSE-PROMPTVIEW, node: WEBPAGE_P1, chunker: markdown_structure_v1, scope: whole_batch, contract: SHORT_PROSE, aggregation: stable_union_v1, close_mode: separate, selector_backend: LLM,         publication_path: DIRECT_PROSE,         output_representation: SHORT_PROSE,  is_control: true, prompt_admission: prompt_pack_v1}
  # Diagnostic only. Runs when the whole-batch prompt fits the window and records
  # PROMPT_INFEASIBLE when it does not; stays in the all-offered denominator and may never be
  # promoted to champion. Measured over 1,632 batches, 61.9% are infeasible.
  - {variant_id: LLM-FULL,              node: WEBPAGE_P1, chunker: markdown_structure_v1, scope: whole_batch, contract: P1_ID,       aggregation: budget_pack_v1, close_mode: separate, selector_backend: LLM,         publication_path: STRUCTURED_SELECTION, output_representation: EVIDENCE_IDS, prompt_admission: none, diagnostic_only: true}

  # Matched H ablations. These fill the missing cells needed to change exactly one factor at a
  # time: H02 -> H_TYPED_STABLE changes only the output contract;
  # H_TYPED_STABLE -> H03 changes only aggregation; H03 -> H_HIER_COVERAGE changes only scope;
  # H_HIER_COVERAGE -> H05 changes only the typed/bridge contract (including bridge caps).
  - {variant_id: H_TYPED_STABLE, node: WEBPAGE_P1,  chunker: markdown_structure_v1, scope: per_page,      contract: P1_TYPED,     aggregation: stable_union_v1,   close_mode: separate, selector_backend: LLM, publication_path: STRUCTURED_SELECTION, output_representation: TYPED_EVIDENCE}
  - {variant_id: H03,           node: WEBPAGE_P1,  chunker: markdown_structure_v1, scope: per_page,      contract: P1_TYPED,     aggregation: coverage_budget_v1, close_mode: separate, selector_backend: LLM, publication_path: STRUCTURED_SELECTION, output_representation: TYPED_EVIDENCE}
  - {variant_id: H_HIER_COVERAGE, node: WEBPAGE_P1, chunker: markdown_structure_v1, scope: hierarchical, contract: P1_TYPED,     aggregation: coverage_budget_v1, close_mode: separate, selector_backend: LLM, publication_path: STRUCTURED_SELECTION, output_representation: TYPED_EVIDENCE}
  - {variant_id: H04,           node: WEBPAGE_P1,  chunker: markdown_structure_v1, scope: hierarchical,  contract: P1_TYPED,     aggregation: global_rerank_v1, close_mode: separate, selector_backend: LLM, publication_path: STRUCTURED_SELECTION, output_representation: TYPED_EVIDENCE}
  - {variant_id: H05,           node: WEBPAGE_P1,  chunker: markdown_structure_v1, scope: hierarchical,  contract: P1_BRIDGE,    aggregation: coverage_budget_v1, close_mode: separate, selector_backend: LLM, publication_path: STRUCTURED_SELECTION, output_representation: BRIDGED_EVIDENCE, bridge_token_cap_each: 64, bridge_token_cap_total: 128}

  # RESEARCHER_CLOSE / C_VISIBLE family (compressor-only: sees only what P0's compressor saw)
  # Both controls deliberately share C01's candidate construction and publication mode. Thus
  # C01 vs C00-CPU changes only who selects, and C01 vs C00-PROSE changes only the output
  # language. Keeping paragraph chunking or a different close mode here would confound either
  # control with a different visible candidate set/publication path.
  - {variant_id: C00-CPU,       node: C_VISIBLE,   chunker: markdown_structure_v1, scope: per_researcher, contract: P1_ID,       aggregation: stable_union_v1, close_mode: dedicated_selector, selector_backend: CPU_LEXICAL, publication_path: STRUCTURED_SELECTION, output_representation: EVIDENCE_IDS, is_control: true}
  - {variant_id: C00-PROSE,     node: C_VISIBLE,   chunker: markdown_structure_v1, scope: per_researcher, contract: SHORT_PROSE, aggregation: stable_union_v1, close_mode: dedicated_selector, selector_backend: LLM,         publication_path: DIRECT_PROSE,         output_representation: SHORT_PROSE, is_control: true}
  - {variant_id: C01,           node: C_VISIBLE,   chunker: markdown_structure_v1, scope: per_researcher, contract: P1_ID,       aggregation: stable_union_v1, close_mode: dedicated_selector, selector_backend: LLM,         publication_path: STRUCTURED_SELECTION, output_representation: EVIDENCE_IDS}
  - {variant_id: C_TYPED_STABLE, node: C_VISIBLE,  chunker: markdown_structure_v1, scope: per_researcher, contract: P1_TYPED,    aggregation: stable_union_v1, close_mode: dedicated_selector, selector_backend: LLM,         publication_path: STRUCTURED_SELECTION, output_representation: TYPED_EVIDENCE}
  - {variant_id: C02,           node: C_VISIBLE,   chunker: markdown_structure_v1, scope: per_researcher, contract: P1_TYPED,    aggregation: coverage_budget_v1, close_mode: dedicated_selector, selector_backend: LLM, publication_path: STRUCTURED_SELECTION, output_representation: TYPED_EVIDENCE}
  - {variant_id: C03,           node: C_VISIBLE,   chunker: markdown_structure_v1, scope: per_researcher, contract: P1_BRIDGE,   aggregation: coverage_budget_v1, close_mode: dedicated_selector, selector_backend: LLM, publication_path: STRUCTURED_SELECTION, output_representation: BRIDGED_EVIDENCE, bridge_token_cap_each: 64, bridge_token_cap_total: 128}
  - {variant_id: C04,           node: C_VISIBLE,   chunker: markdown_structure_v1, scope: per_researcher, contract: P1_TYPED,    aggregation: coverage_budget_v1, close_mode: prefix_preserving, selector_backend: LLM, publication_path: PREFIX_PRESERVING_SELECTION, output_representation: TYPED_EVIDENCE, runnable: false, unavailable_reason: "Prefix preserving must preserve the selector input prefix and prove APC reuse; output wrapping is not the treatment."}

  # Extensions reported separately (never as compressor-only)
  - {variant_id: C05-FUSED-EXT, node: C_FUSED_EXT, chunker: paragraph_sentence_v1, scope: per_researcher, contract: P1_TYPED,    aggregation: coverage_budget_v1, close_mode: fused_with_fallback, selector_backend: LLM, publication_path: FUSED_SELECTION, output_representation: TYPED_EVIDENCE, runnable: false, unavailable_reason: "Requires a real ResearchCompleteWithSelection tool and checkpoint contract; dedicated fallback is not fused selection."}
  - {variant_id: C06-REG,       node: C_REGISTRY,  chunker: markdown_structure_v1, scope: per_researcher, contract: P1_TYPED,    aggregation: coverage_budget_v1, close_mode: dedicated_selector, selector_backend: LLM, publication_path: STRUCTURED_SELECTION, output_representation: TYPED_EVIDENCE, runnable: false, unavailable_reason: "Runner/adapter does not yet supply raw registry spans plus frozen snapshots; C_VISIBLE fallback is forbidden."}
